appId: com.ldctools.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "sign-in-email"
    timeout: 90000
- tapOn:
    id: "sign-in-email"
- inputText: ${EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${PASSWORD}
- tapOn:
    id: "sign-in-submit"
- extendedWaitUntil:
    visible: "My Work"
    timeout: 30000
- assertVisible: "Available"
- tapOn: "Available"
- assertVisible: "Claimable work that no one has taken yet."
- tapOn: "Projects"
- assertVisible: "Projects"
- tapOn: "Directory"
- assertVisible: "Construction group"
- tapOn: "Chat"
- assertVisible: "Chats"
- tapOn: "More"
- assertVisible: "Processes"
